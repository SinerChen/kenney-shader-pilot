<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FG01 · S1 P3 实验结果</title>
<style>body{margin:0;background:#13211b;color:#e1eee5;font:15px/1.65 system-ui,'Microsoft YaHei'}main{max-width:1450px;margin:auto;padding:30px}a{color:#b4dd95}h1{font-size:30px}p,.muted{color:#b3c4bb}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}.card{background:#203229;padding:18px;border:1px solid #42604d;border-radius:10px;min-width:0}img{width:100%;background:#101a15}nav{display:flex;gap:16px;flex-wrap:wrap}pre{white-space:pre-wrap;overflow-wrap:anywhere;max-height:500px;overflow:auto;background:#112019;padding:12px}summary{cursor:pointer}.error{color:#ffad96}h2{margin-top:35px}.pill{display:inline-block;background:#3d533d;padding:3px 10px;border-radius:15px}.pair{display:grid;grid-template-columns:1fr 1fr;gap:8px}.pair figure{margin:0}.pair figcaption{font-size:12px}button{background:#3b593f;color:white;border:1px solid #6d8768;padding:8px;border-radius:5px;cursor:pointer}#notice{border-left:3px solid #b4dd95;padding-left:15px}@media(max-width:900px){.grid{grid-template-columns:1fr}main{padding:18px}}</style>
<main><nav><a href="index.html">题目与作者参考</a><a href="experiment/P3.md">S1/P3 规则</a><a href="verification/project-audit.json">工程精简检查</a><a href="experiment/README.md">目录与运行说明</a></nav><h1>Forest 草地 · L1 → L2 → L3</h1>
<p id="notice">4 个模型，共 12 项。每个模型继承自己的上一层候选；80 次请求 / 24 次检查。候选使用真实 Godot 渲染；阶段 pass 为模型自评，尚无独立视觉评分。右侧作者参考仅供你对比，不发送给 API。</p><p id="updated"></p><div id="models"></div></main>
<script>
const models=[['claude_main','Claude Sonnet 5'],['openai_astra','GPT-6 Astra'],['openai_main','GPT-5.6 Sol'],['kimi_retry_128k','Kimi K3']];
const statuses={running:'处理中',requesting:'等待 API',rendering:'GPU 检查中',retry_wait:'HTTP 重试等待（5 分钟）',final_render:'最终渲染中',finished:'已结束'};
const titles=['让草随风动','根部固定，顶部摆动','玩家经过后向外倒伏并恢复'];
const el=(tag,text)=>{const e=document.createElement(tag);if(text!=null)e.textContent=text;return e};
function link(text,url){const a=el('a',text);a.href=url;return a}
async function json(url){try{const r=await fetch(url,{cache:'no-store'});return r.ok?await r.json():null}catch{return null}}
for(const [alias,title]of models){const section=el('section');section.append(el('h2',title));const grid=el('div');grid.className='grid';section.append(grid);for(let level=1;level<=3;level++){const card=el('article');card.className='card';card.id=alias+level;grid.append(card)}document.querySelector('#models').append(section)}
async function refresh(){for(const[alias,title]of models){for(let level=1;level<=3;level++){const base=`runs/s1_p3/${alias}/L${level}/`;const[s,r]=await Promise.all([json(base+'status.json'),json(base+'result.json')]);const card=document.getElementById(alias+level);const signature=JSON.stringify([s,r]);if(card.dataset.signature===signature)continue;card.dataset.signature=signature;card.replaceChildren(el('h3',`L${level} · ${titles[level-1]}`));const p=el('span',s?statuses[s.status]||s.status:(level===1?'排队':'等待同模型前一层'));p.className='pill';card.append(p);if(!s)continue;
card.append(el('p',`请求 ${s.requests}/80 · 检查 ${s.checks}/24 · 阶段 ${s.completed_steps}/${s.total_steps} · 版本 ${s.revision}`));if(s.error){const p=el('p',s.error);p.className='error';card.append(p)}if(s.retry_at)card.append(el('p','重试时间：'+s.retry_at));
if(r){card.append(el('p',`终止原因：${r.stop_reason}；正式提交：${r.submitted?'是':'否'}；技术渲染：${r.execution.execution_ok?'通过':'失败'}。视觉质量待人工评审。`));if(r.error)card.append(el('p',r.error));if(r.execution.errors?.length){const p=el('p',r.execution.errors.join('\n'));p.className='error';card.append(p)}if(r.execution.execution_ok){const pair=el('div');pair.className='pair';const c=level===3?'player_pass_recover':'wind_default';for(const[label,src]of[['模型最终动画',base+`final/${c}/animation.webp`],['作者参考（未发 API）',`verification/L${level}/animation.webp`]]){const f=el('figure');const a=link('',src);a.target='_blank';const img=el('img');img.src=src;img.alt=label;a.append(img);f.append(a,el('figcaption',label));pair.append(f)}card.append(pair)}}
const nav=el('nav');nav.append(link('查看子任务与截图',`trajectory.html?model=${alias}&level=${level}`),link('当前代码',base+'grass.gdshader'),link('初始代码',base+'initial.gdshader'),link('完整 prompt',base+'prompt.txt'),link('状态 JSON',base+'state.json'));card.append(nav);
}}document.querySelector('#updated').textContent='每 15 秒自动更新 · '+new Date().toLocaleString()}
async function queueStatus(){const q=await json('runtime/after_sol.json');if(!q)return;let box=document.getElementById('queueStatus');if(!box){box=el('p');box.id='queueStatus';document.getElementById('updated').after(box)}const text={waiting:'队列已安排：等待 Sol 本轮结束后，Claude 从 L1 重新运行；旧失败记录届时归档。',running:'Sol 本轮已结束，Claude 的 L1→L2→L3 重跑已启动。',finished:'Claude 重跑进程已结束，具体完成情况见各级结果。',error:'Claude 后续队列出错：'+(q.error||'')};box.textContent=text[q.status]||q.status;const restart=await json('runs/s1_p3/claude_main/restart.json');if(restart?.previous_run){box.append(document.createTextNode(' '),link('查看 Claude 原失败记录',restart.previous_run+'/L1/result.json'))}}
async function kimiQueueStatus(){const q=await json('runtime/after_claude.json');if(!q)return;let box=document.getElementById('kimiQueueStatus');if(!box){box=el('p');box.id='kimiQueueStatus';document.getElementById('updated').after(box)}const text={waiting:'后续队列：Sol → Claude → Kimi L3。Kimi 等 Claude 本轮结束后续跑，只恢复 L3，保留 L1/L2 及剩余预算。',running:'Claude 本轮已结束，Kimi L3 已从检查点恢复，结果更新在原卡片。',finished:'Kimi L3 续跑进程已结束，具体结果见 Kimi L3 卡片。',error:'Kimi L3 后续队列出错：'+(q.error||'')};box.textContent=text[q.status]||q.status}
refresh();queueStatus();kimiQueueStatus();setInterval(()=>{refresh();queueStatus();kimiQueueStatus()},15000);
</script></html>
