<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FG01 · 子任务过程</title><style>body{background:#14241b;color:#dceee1;font:15px/1.7 system-ui;margin:30px auto;max-width:1250px;padding:0 20px}a{color:#b9df9e}pre{white-space:pre-wrap;overflow-wrap:anywhere;max-height:650px;overflow:auto;background:#20392a;padding:15px}details{border:1px solid #44654a;padding:12px;margin:12px 0}summary{cursor:pointer}.images{display:flex;gap:12px;flex-wrap:wrap}.images a{width:min(100%,380px)}img{width:100%}button{padding:10px}</style><a href="results.html">← 返回实验结果</a><h1 id="title">子任务与检查</h1><p>记录来自本次模型会话。阶段判断是模型自评；截图是候选工程实际输出。</p><button onclick="location.reload()">刷新进度</button><div id="plan"></div><div id="checks"></div><h2>可展开的完整调用轨迹</h2><p>每个事件单独展开，保留原始响应、错误与输入，不把 JSONL 挤在一行显示。</p><div id="events"></div><script>
const q=new URLSearchParams(location.search),alias=q.get('model'),level=q.get('level');const allowed=['claude_main','openai_astra','openai_main','kimi_retry_128k'];
const el=(tag,text)=>{const e=document.createElement(tag);if(text!=null)e.textContent=text;return e};
async function run(){if(!allowed.includes(alias)||!['1','2','3'].includes(level))return;const base=`runs/s1_p3/${alias}/L${level}/`;document.querySelector('#title').textContent=`${alias} · L${level} · S1/P3`;const res=await fetch(base+'state.json',{cache:'no-store'});if(!res.ok)return;const state=await res.json();const plan=document.querySelector('#plan');plan.append(el('h2','模型制定的子任务'));for(const s of state.steps){const d=el('details');d.append(el('summary',s.id+' · '+s.goal),el('pre',JSON.stringify(s,null,2)));plan.append(d)}
for(const c of state.checks){const d=el('details');d.append(el('summary',`${c.id} · ${c.step_id} · 版本 ${c.revision} · ${c.execution_ok?'技术执行成功':'技术执行失败'} · ${c.images_sent?'已回传 PNG':'未回传 PNG'}`),el('pre',JSON.stringify(c.request,null,2)));const r=await fetch(base+`checks/${c.id}/result.json`,{cache:'no-store'});if(r.ok){const report=await r.json();d.append(el('pre',JSON.stringify(report,null,2)));const imgs=el('div');imgs.className='images';for(const cs of report.cases||[])for(const f of cs.frames||[]){const path=base+`checks/${c.id}/${cs.name}/${String(f).padStart(3,'0')}.png`;const a=el('a');a.href=path;a.target='_blank';const img=el('img');img.loading='lazy';img.src=path;img.alt=cs.name+' '+f;a.append(img,el('span',cs.name+' · '+f));imgs.append(a)}d.append(imgs)}document.querySelector('#checks').append(d)}
const tr=await fetch(base+'trajectory.jsonl',{cache:'no-store'});if(tr.ok){let index=0;for(const line of(await tr.text()).split('\n').filter(Boolean)){let v;try{v=JSON.parse(line)}catch{continue}const d=el('details');d.append(el('summary',`${++index}. ${v.time} · ${v.type}`));d.addEventListener('toggle',()=>{if(d.open&&!d.querySelector('pre'))d.append(el('pre',JSON.stringify(v,null,2)))});document.querySelector('#events').append(d)}}}run();
</script></html>
