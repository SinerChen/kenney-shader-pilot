<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>森林 S1 / P3 实验</title>
<style>body{font:15px/1.65 system-ui;margin:0;background:#f4f6f3;color:#203328}header{padding:20px 28px;background:#173f30;color:#fff}h1{font-size:23px;margin:0}main{display:grid;grid-template-columns:270px minmax(0,1fr);gap:22px;padding:24px}aside{position:sticky;top:12px;align-self:start;max-height:90vh;overflow:auto}button,select{font:inherit;padding:7px;border:1px solid #c6d3cb;border-radius:7px;background:white;cursor:pointer}select{width:100%;margin-bottom:12px}.case{display:block;text-align:left;width:100%;margin:5px 0}.case.active{background:#d2e9d9;border-color:#287546}.case small{display:block;color:#567060}.panel{background:white;border:1px solid #d9e2dc;padding:18px;border-radius:10px;margin-bottom:18px;min-width:0}h2{margin:0 0 12px;font-size:19px}video{width:100%;max-height:540px;background:#101712}pre{white-space:pre-wrap;word-break:break-word;max-height:640px;overflow:auto;background:#f3f5f3;padding:12px;font:13px/1.6 ui-monospace,monospace}summary{cursor:pointer;padding:8px;background:#edf3ef;margin-top:6px}a{color:#287546;margin-right:14px}.muted{color:#62786b}.images{display:flex;gap:8px;overflow:auto}.images img{max-width:32%;object-fit:contain}#global{font-size:13px;opacity:.9}@media(max-width:760px){main{grid-template-columns:1fr;padding:12px}aside{position:static;max-height:230px}}</style>
<header><h1>森林测试 · S1 / P3</h1><div id="global">加载实验状态…</div></header><main><aside><select id="models"></select><nav id="tasks"></nav><p class="muted">15 道可运行题 × 4 个模型。C_L3_S 单独记录源阻塞。每 10 秒更新状态。</p><a href="/index.html">作者题目与参考页</a></aside><section>
<div class="panel"><h2 id="title">选择案例</h2><div id="status"></div><div id="links"></div></div>
<div class="panel"><h2>效果视频</h2><p id="mediaStatus" class="muted"></p><video id="video" controls loop muted playsinline></video><div id="images" class="images"></div></div>
<div class="panel"><h2>实际 Prompt 与工具</h2><pre id="prompt"></pre></div>
<div class="panel"><h2>P3 计划与结束结果</h2><pre id="plan"></pre><pre id="result"></pre></div>
<div class="panel"><h2>修改的文件</h2><div id="files"></div></div>
<div class="panel"><h2>调用轨迹</h2><div id="events"></div></div>
</section></main><script>
const $=id=>document.getElementById(id);let state={},alias='',task='',lastCase='';const pretty=x=>JSON.stringify(x,null,2);
const names={pending:'待运行',requesting:'模型请求中',executing_tool:'工具执行中',rendering:'渲染中',retry_wait:'HTTP 等待重试',model_finished:'模型已结束',budget_exhausted:'预算耗尽',blocked_source:'源场景阻塞',paused_error:'错误暂停'};
async function refresh(){state=await(await fetch('/api/state')).json();let g=state.status;$('global').textContent=`${g.status||'未启动'} · 已结束 ${g.completed_tasks||0}/${g.total_tasks||60} · 串行 · ${g.current?g.current.alias+' / '+g.current.task_id:''}`;if(!$('models').options.length){for(let m of state.models){let o=new Option(m.model,m.alias);$('models').add(o)}alias=state.models[0]?.alias||''}drawTasks();if(task)await showCase();}
function drawTasks(){$('tasks').replaceChildren();for(let row of state.rows.filter(r=>r.alias===alias)){let b=document.createElement('button');b.className='case'+(row.task===task?' active':'');b.append(document.createTextNode(row.task));let s=document.createElement('small');s.textContent=`${names[row.status]||row.status} · 请求 ${row.requests} · 渲染 ${row.renders}`;b.append(s);b.onclick=()=>{task=row.task;drawTasks();showCase()};$('tasks').append(b)}if(!task){task=state.rows.find(r=>r.alias===alias)?.task||'';if(task)showCase()}}
function detail(parent,title,value){let d=document.createElement('details'),s=document.createElement('summary'),p=document.createElement('pre');s.textContent=title;p.textContent=value;d.append(s,p);parent.append(d)}
async function showCase(){let selected=alias+'/'+task;let data=await(await fetch('/api/case?alias='+encodeURIComponent(alias)+'&task='+encodeURIComponent(task))).json();if(selected!==alias+'/'+task)return;$('title').textContent=selected;$('status').textContent=names[data.result.stop_reason||data.status.status]||data.result.stop_reason||data.status.status||'待运行';$('prompt').textContent=(data.input.messages||[]).map(m=>m.role.toUpperCase()+'\n'+m.content).join('\n\n---\n\n')+'\n\n'+pretty(data.input.tools||[]);$('plan').textContent=pretty(data.plan);$('result').textContent=pretty(data.result);$('links').replaceChildren();for(let [k,v] of Object.entries(data.links)){let a=document.createElement('a');a.href=v;a.textContent=k;a.target='_blank';$('links').append(a)}let media=data.render;$('mediaStatus').textContent=media.error||media.errors?.join('\n')||(media.video_url?'实际候选渲染；能播放不代表算法测试通过。':'尚无成功渲染');let v=$('video');if(media.video_url){if(v.getAttribute('src')!==media.video_url)v.src=media.video_url;v.hidden=false}else{v.removeAttribute('src');v.hidden=true}$('images').replaceChildren();for(let x of media.images||[]){let img=document.createElement('img');img.src=x.url;img.alt='frame '+x.frame;$('images').append(img)}$('files').replaceChildren();for(let f of data.files)detail($('files'),f.path+(f.changed?' · 已修改':' · 与起点相同'),f.diff||f.text);$('events').replaceChildren();for(let e of data.events)detail($('events'),e.time+' · '+e.type+(e.call?' · '+e.call.name:''),pretty(e));lastCase=selected;}
$('models').onchange=()=>{alias=$('models').value;task='';drawTasks()};refresh().catch(e=>$('global').textContent=e.message);setInterval(()=>refresh().catch(()=>{}),10000);
</script></html>
